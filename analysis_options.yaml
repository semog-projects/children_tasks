# Configuração do analisador estático. Rode com `flutter analyze`.
# Docs: https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Trata TODOs pendentes como aviso, não como info silenciosa.
    todo: ignore
    # Falha o build se um valor de retorno importante for ignorado.
    unawaited_futures: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
